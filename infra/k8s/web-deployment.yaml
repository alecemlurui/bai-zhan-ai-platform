apiVersion: apps/v1
kind: Deployment
metadata:
  name: bai-zhan-web
  namespace: bai-zhan
  labels:
    app: bai-zhan-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bai-zhan-web
  template:
    metadata:
      labels:
        app: bai-zhan-web
    spec:
      containers:
        - name: web
          image: bai-zhan-ai-platform:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: bai-zhan-config
            - secretRef:
                name: bai-zhan-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
